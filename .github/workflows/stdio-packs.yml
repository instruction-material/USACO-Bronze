name: Bronze stdio pack acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify optimality, unfinished learners and stdio drivers
        run: python3 tests/verify-stdio-packs.py
